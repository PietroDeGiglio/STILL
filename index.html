                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </button>
                <button v-if="editingPlanId" @click="promptDeletePlan" class="w-full bg-white border border-red-200 text-red-500 font-bold py-3.5 rounded-2xl shadow-sm hover:bg-red-50 transition-all active:scale-95 flex items-center justify-center gap-2">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  Elimina Piano
                </button>
              </div>

            </div>

            <!-- VISTA: BUILDER MENU (NEW) -->
            <div v-if="nutritionView === 'builder'" class="space-y-5 animate-fadeIn">
              <!-- Header -->
              <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-3">
                  <button @click="nutritionView = 'create'" class="p-2.5 bg-white border border-gray-100 shadow-sm rounded-xl text-gray-400 hover:text-viola hover:border-viola/30 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                  </button>
                  <div>
                    <div class="text-[10px] font-bold text-viola tracking-widest uppercase">FASE 2</div>
                    <h2 class="text-2xl font-bold text-antracite leading-tight">{{ editingPlanId ? 'Modifica Menù' : 'Costruisci Menù' }}</h2>
                  </div>
                </div>
              </div>

              <!-- Settimane -->
              <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar pb-1">
                <button v-for="(week, wIdx) in newPlanBuilder.weeks" :key="wIdx" 
                        @click="newPlanBuilder.currentWeekIdx = wIdx"
                        class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-colors"
                        :class="newPlanBuilder.currentWeekIdx === wIdx ? 'bg-viola text-white shadow-md' : 'bg-white text-gray-500 border border-gray-100 hover:bg-gray-50'">
                  Settimana {{ wIdx + 1 }}
                </button>
                <button @click="addWeekToBuilder" class="px-3 py-2 rounded-xl text-xs font-bold bg-viola/10 text-viola whitespace-nowrap hover:bg-viola/20 transition-colors flex items-center gap-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                  Settimana
                </button>
              </div>

              <!-- Giorni -->
              <div class="bg-white rounded-3xl p-2 border border-gray-100 shadow-soft flex overflow-x-auto hide-scrollbar gap-1">
                <button v-for="day in weekDays" :key="day"
                        @click="newPlanBuilder.currentDay = day"
                        class="flex-1 min-w-[45px] py-3 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all"
                        :class="newPlanBuilder.currentDay === day ? 'bg-viola/10 text-viola font-extrabold' : 'text-gray-400 font-bold hover:bg-gray-50'">
                  <span class="text-xs">{{ day.substring(0,3) }}</span>
                </button>
              </div>

              <!-- Pasti del giorno selezionato -->
              <div class="space-y-4">
                <div class="flex justify-between items-center px-1">
                  <h3 class="text-sm font-bold text-antracite">Pasti di {{ newPlanBuilder.currentDay }}</h3>
                </div>

                <div v-if="currentBuilderMeals.length === 0" class="text-center py-6 bg-white rounded-3xl border border-dashed border-gray-200">
                  <p class="text-xs text-gray-400 font-medium">Nessun pasto inserito.<br>Inizia ad aggiungere i pasti per questa giornata.</p>
                </div>

                <div v-for="(meal, mIdx) in currentBuilderMeals" :key="mIdx" class="bg-white rounded-3xl p-4 border border-gray-100 shadow-sm space-y-3 relative">
                  <!-- Rimuovi Pasto -->
                  <button @click="removeMealFromBuilder(mIdx)" class="absolute top-4 right-4 text-red-400 hover:text-red-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  </button>

                  <!-- Tipo Pasto -->
                  <div class="pr-8">
                    <select v-model="meal.type" class="w-full bg-gray-50 border border-gray-200 focus:border-viola rounded-xl p-2.5 text-sm font-bold text-antracite outline-none appearance-none">
                      <option v-for="t in mealTypes" :key="t.id" :value="t.id">{{ t.icon }} {{ t.label }}</option>
                    </select>
                  </div>

                  <!-- Slot Alimenti -->
                  <div class="space-y-2">
                    <div v-for="(item, iIdx) in meal.items" :key="iIdx" class="flex gap-2 items-center">
                      <input type="text" v-model="meal.items[iIdx]" placeholder="Es: 50g Riso Basmati" 
                             class="flex-1 bg-white border border-gray-200 focus:border-viola focus:ring-1 focus:ring-viola/20 rounded-xl p-2.5 text-xs font-medium text-antracite outline-none transition-all">
                      <button v-if="meal.items.length > 1" @click="removeSlotFromMeal(meal, iIdx)" class="p-2 text-gray-400 hover:text-red-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                      </button>
                    </div>
                  </div>
                  
                  <button @click="addSlotToMeal(meal)" class="text-[10px] font-bold text-viola uppercase tracking-widest flex items-center gap-1 hover:opacity-80">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Aggiungi Alimento
                  </button>
                </div>

                <!-- Aggiungi Pasto Button -->
              <button @click="addMealToBuilder" class="w-full py-3.5 border-2 border-dashed border-gray-200 bg-gray-50 rounded-2xl text-gray-500 font-bold text-xs hover:border-viola/40 hover:text-viola hover:bg-viola/5 transition-colors flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Nuovo Pasto
              </button>
            </div>

            <!-- Button Salva Finale -->
            <button @click="finalizeNewPlan" 
                    :class="isPlanBuilderComplete ? 'bg-salvia text-white shadow-lg hover:bg-salvia/90' : 'bg-transparent text-salvia border-2 border-salvia hover:bg-salvia/5'"
                    class="w-full font-bold py-4 rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-2 mt-6">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              {{ editingPlanId ? 'Salva Modifiche' : 'Salva Piano Definitivo' }}
            </button>

          </div>

          <!-- VISTA: DETTAGLIO PIANO -->
            <div v-if="nutritionView === 'detail' && selectedPlan" class="space-y-5 animate-fadeIn">
              
              <!-- Header Dettaglio -->
              <div class="flex justify-between items-start">
                <div>
                  <button @click="nutritionView = 'list'" class="flex items-center gap-1 text-xs font-bold text-gray-400 hover:text-antracite transition-colors mb-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    Torna ai piani
                  </button>
                  <h2 class="text-2xl font-bold text-antracite leading-tight">{{ selectedPlan.name }}</h2>
                  <div class="text-[10px] font-bold text-gray-400 uppercase mt-1">
                    {{ selectedPlan.status === 'active' ? 'Piano Attivo' : 'Piano Terminato' }}
                  </div>
                </div>
                
                <button @click="nutritionView = 'calendar'" class="p-2 bg-salvia/10 text-salvia rounded-xl hover:bg-salvia/20 transition-colors shadow-sm">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </button>
              </div>

              <!-- NOTA DEL GIORNO IN NUTRIZIONE (Se presente) -->
              <div v-if="noteForToday" class="bg-salvia/10 border border-salvia/30 p-4 rounded-3xl relative shadow-sm animate-fadeIn">
                <div class="flex items-start gap-3 relative z-10">
                  <div class="w-10 h-10 rounded-full bg-salvia/20 flex items-center justify-center text-xl flex-shrink-0">📝</div>
                  <div class="space-y-1 w-full">
                    <h4 class="text-sm font-extrabold text-salvia">La tua nota di oggi</h4>
                    <p class="text-xs text-antracite font-medium leading-relaxed">
                      {{ noteForToday }}
                    </p>
                  </div>
                </div>
              </div>

              <!-- MACROS SUMMARY (Auto-calculated) -->
              <div class="bg-white rounded-3xl p-5 border border-gray-100 shadow-soft">
                <div class="flex justify-between items-center mb-4">
                  <span class="text-xs font-bold text-gray-500 uppercase">Obiettivo Oggi</span>
                  <span class="text-lg font-extrabold text-antracite">{{ selectedPlanTotalCalories }} <span class="text-xs font-medium text-gray-400">kcal totali</span></span>
                </div>
                <div class="w-full bg-gray-100 h-2.5 rounded-full overflow-hidden mb-4">
                  <div class="bg-salvia h-full rounded-full" style="width: 100%"></div>
                </div>
              </div>

              <!-- DAILY MEALS LIST -->
              <div class="space-y-3">
                <h4 class="text-xs font-bold text-gray-500 uppercase tracking-widest pl-1">I Pasti del Piano</h4>
                
                <div v-for="meal in selectedPlan.meals" :key="meal.id" class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm flex gap-4">
                  <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-xl flex-shrink-0 border border-gray-100">
                    {{ meal.icon }}
                  </div>
                  <div class="flex-1">
                    <div class="flex justify-between items-center mb-1">
                      <h5 class="text-sm font-bold text-antracite">{{ meal.name }}</h5>
                      <span class="text-[10px] font-bold text-salvia bg-salvia/10 px-2 py-0.5 rounded-md">{{ meal.calories }} kcal</span>
                    </div>
                    <p class="text-xs text-gray-500 leading-relaxed">{{ meal.description }}</p>
                  </div>
                </div>
              </div>

              <!-- PLAN ACTIONS -->
              <div class="pt-6 pb-4 space-y-3">
                <button @click="editPlan(selectedPlan)" 
                        class="w-full bg-white border-2 border-viola text-viola font-bold py-3.5 rounded-2xl shadow-sm hover:bg-viola/5 transition-all active:scale-95 flex justify-center items-center gap-2">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                  Modifica Piano
                </button>
                <button v-if="selectedPlan.status === 'active'" 
                        @click="promptTerminatePlan" 
                        class="w-full bg-viola text-white font-bold py-3.5 rounded-2xl shadow-sm hover:bg-viola/90 transition-all active:scale-95">
                  Termina Piano Attivo
                </button>
                <button v-else 
                        @click="reactivatePlan(selectedPlan)" 
                        class="w-full bg-salvia text-white font-bold py-3.5 rounded-2xl shadow-lg hover:bg-salvia/90 transition-all active:scale-95">
                  Riattiva Piano
                </button>
              </div>

            </div>

            <!-- VISTA: CALENDARIO & EXPORT -->
            <div v-if="nutritionView === 'calendar'" class="space-y-5 animate-fadeIn">
              
              <div class="flex justify-between items-center">
                <button @click="nutritionView = 'detail'" class="flex items-center gap-1 text-xs font-bold text-gray-400 hover:text-antracite transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                  Indietro
                </button>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-antracite uppercase tracking-widest">Esporta Menù</span>
                  <!-- Toggle Export Mode -->
                  <div @click="exportMode = !exportMode; exportSelectedDates = []" 
                       class="w-10 h-5 bg-gray-200 rounded-full relative cursor-pointer transition-colors"
                       :class="exportMode ? 'bg-salvia' : 'bg-gray-300'">
                    <div class="w-4 h-4 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform"
                         :class="exportMode ? 'translate-x-5' : ''"></div>
                  </div>
                </div>
              </div>

              <div class="flex justify-between items-center px-2 py-2">
                <button @click="prevMonth" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-50 text-gray-400 hover:text-salvia transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <h3 class="text-xl font-extrabold text-salvia capitalize">{{ currentMonthName }} {{ currentYear }}</h3>
                <button @click="nextMonth" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-50 text-gray-400 hover:text-salvia transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </button>
              </div>

              <!-- Calendar Grid -->
              <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-soft">
                <div class="grid grid-cols-7 gap-1 text-center mb-2">
                  <div v-for="day in ['L','M','M','G','V','S','D']" :key="day" :class="day === 'D' ? 'text-salvia' : 'text-gray-400'" class="text-[10px] font-bold">{{ day }}</div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center">
                  <!-- Empty slots for alignment -->
                  <div v-for="empty in firstDayOfMonth" :key="'empty-'+empty" class="p-2"></div>
                  <!-- Days -->
                  <div v-for="date in daysInMonth" :key="date" 
                       @click="handleDayClick(date)"
                       class="aspect-square p-1 flex items-center justify-center relative">
                    
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold cursor-pointer transition-all"
                         :class="[
                           exportMode && exportSelectedDates.includes(date) ? 'bg-salvia text-white shadow-md' : '',
                           !exportMode && isToday(date) ? 'bg-gray-100 text-salvia font-extrabold ring-2 ring-salvia/20' : '',
                           !exportMode && !isToday(date) && !isSunday(date) ? 'text-gray-600 hover:bg-gray-50' : '',
                           !exportMode && !isToday(date) && isSunday(date) ? 'text-salvia bg-salvia/5 hover:bg-salvia/10' : '',
                           hasComment(date) && !exportMode ? 'ring-2 ring-viola/40' : ''
                         ]">
                      {{ date }}
                    </div>
                    <!-- Indicator dot for comment -->
                    <div v-if="hasComment(date) && !exportMode" class="absolute bottom-1 w-1 h-1 bg-viola rounded-full"></div>
                  </div>
                </div>
              </div>

              <!-- Export Button Container -->
              <div v-if="exportMode" class="animate-fadeIn pt-4">
                <button @click="exportSelectedMenu" 
                        :disabled="exportSelectedDates.length === 0"
                        class="w-full bg-salvia text-white font-bold py-3.5 rounded-2xl shadow-lg hover:bg-salvia/90 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                  Condividi {{ exportSelectedDates.length }} giorni
                </button>
              </div>

            </div>

          </div>

        </main>

        <!-- GLOBAL MODALS OVERLAY -->
        <div v-if="customModal.isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-antracite/40 backdrop-blur-sm animate-fadeIn">
          <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
            <h3 class="text-xl font-bold text-antracite">{{ customModal.title }}</h3>
            <p class="text-sm text-gray-500 font-medium">{{ customModal.message }}</p>
            
            <!-- Alert / Single Button -->
            <div v-if="customModal.type === 'alert'" class="pt-2">
              <button @click="customModal.isOpen = false" class="w-full bg-viola text-white font-bold py-3 rounded-xl hover:bg-viola/90">Ho capito</button>
            </div>
            
            <!-- Confirm / Due Bottoni -->
            <div v-if="customModal.type === 'confirm'" class="pt-2 flex gap-3">
              <button @click="customModal.isOpen = false" class="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-xl hover:bg-gray-200">Annulla</button>
              <button @click="executeConfirm" class="flex-1 bg-viola text-white font-bold py-3 rounded-xl hover:bg-viola/90">Conferma</button>
            </div>
          </div>
        </div>

        <!-- COMMENT MODAL (Calendar) -->
        <div v-if="commentModal.isOpen" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-antracite/40 backdrop-blur-sm animate-fadeIn">
          <div class="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4 transition-transform transform flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center shrink-0">
              <h3 class="text-lg font-bold text-antracite">Dettaglio {{ commentModal.date }} {{ currentMonthName }}</h3>
              <button @click="closeCommentModal" class="p-1 text-gray-400 hover:text-antracite">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
            
            <!-- Menu del Giorno -->
            <div class="overflow-y-auto flex-1 space-y-2 pr-1 hide-scrollbar">
              <div class="text-[10px] font-bold text-salvia uppercase tracking-widest mb-1">Menù Previsto</div>
              <div v-for="meal in (selectedPlan ? selectedPlan.meals : meals)" :key="meal.id" class="flex items-center gap-3 bg-gray-50 p-2.5 rounded-2xl border border-gray-100">
                <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center text-sm shadow-sm">{{ meal.icon }}</div>
                <div class="flex-1">
                  <h5 class="text-xs font-bold text-antracite">{{ meal.name }}</h5>
                  <p class="text-[10px] text-gray-500 line-clamp-1">{{ meal.description }}</p>
                </div>
                <span class="text-[10px] font-bold text-gray-400 whitespace-nowrap">{{ meal.calories }} kcal</span>
              </div>
            </div>

            <div class="shrink-0 space-y-3 pt-2 border-t border-gray-100">
              <div class="text-[10px] font-bold text-salvia uppercase tracking-widest">I Tuoi Appunti</div>
              <textarea v-model="commentModal.text" rows="3" placeholder="Es: ho saltato lo spuntino, o mi sentivo debole..." class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3 text-sm text-antracite focus:ring-2 focus:ring-salvia focus:border-salvia outline-none resize-none"></textarea>
              <button @click="saveComment" class="w-full bg-salvia text-white font-bold py-3 rounded-xl shadow-md hover:bg-salvia/90 active:scale-95 transition-all">Salva</button>
            </div>
          </div>
        </div>

        <!-- GROCERY CHECKLIST MODAL -->
        <div v-if="groceryModal.isOpen" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-antracite/40 backdrop-blur-sm animate-fadeIn">
          <div class="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-5 transition-transform transform flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center shrink-0">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-viola/10 flex items-center justify-center text-xl border border-viola/20">🛒</div>
                <h3 class="text-lg font-bold text-antracite">Checklist Spesa</h3>
              </div>
              <button @click="groceryModal.isOpen = false" class="p-1 text-gray-400 hover:text-antracite">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>

            <p class="text-sm text-gray-500 font-medium leading-relaxed">Spunta quello che hai già in frigo o in dispensa. Condividi con un tap gli ingredienti mancanti!</p>

            <div class="overflow-y-auto flex-1 space-y-2 pr-1 hide-scrollbar">
              <label v-for="(item, idx) in checklistItems" :key="idx" 
                     class="flex items-center gap-3 p-3.5 bg-gray-50 rounded-2xl border cursor-pointer hover:bg-gray-100 transition-colors" 
                     :class="item.checked ? 'border-viola/30 bg-viola/5' : 'border-gray-100'">
                <input type="checkbox" v-model="item.checked" class="w-5 h-5 text-viola rounded focus:ring-viola border-gray-300 accent-viola">
                <span class="text-sm font-bold transition-all" :class="item.checked ? 'text-gray-400 line-through' : 'text-antracite'">{{ item.name }}</span>
              </label>
            </div>

            <div class="shrink-0 pt-2 border-t border-gray-100">
              <button @click="sharePendingGrocery" class="w-full bg-viola text-white font-bold py-3.5 rounded-2xl shadow-lg hover:bg-viola/90 transition-all active:scale-95 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                Condividi cosa manca
              </button>
            </div>
          </div>
        </div>

        <!-- BOTTOM NAVIGATION TABS -->
        <nav class="bg-white/95 backdrop-blur-lg border-t border-gray-200 px-2 py-2.5 flex justify-between items-center z-20 absolute bottom-0 left-0 right-0 pb-6 sm:pb-2.5">
          <!-- Dashboard (Viola) -->
          <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'text-viola' : 'text-gray-400 hover:text-gray-500'" class="flex flex-col items-center gap-1 transition-all p-2 relative flex-1 group">
            <div :class="activeTab === 'dashboard' ? 'bg-viola/10 text-viola' : 'group-hover:bg-gray-100'" class="p-1.5 rounded-xl transition-colors">
              <svg class="w-6 h-6" stroke="currentColor" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            </div>
            <span class="text-[10px] font-bold">Dashboard</span>
            <span v-if="activeTab === 'dashboard'" class="w-1.5 h-1.5 bg-viola rounded-full absolute bottom-0"></span>
          </button>

          <!-- Allenamento (Arancione) - NEW TAB -->
          <button @click="activeTab = 'allenamento'" :class="activeTab === 'allenamento' ? 'text-arancione' : 'text-gray-400 hover:text-gray-500'" class="flex flex-col items-center gap-1 transition-all p-2 relative flex-1 group">
            <div :class="activeTab === 'allenamento' ? 'bg-arancione/10 text-arancione' : 'group-hover:bg-gray-100'" class="p-1.5 rounded-xl transition-colors">
              <svg class="w-6 h-6" stroke="currentColor" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 6v12M17 6v12M3 9v6h4V9H3zm14 0v6h4V9h-4zM7 12h10"/></svg>
            </div>
            <span class="text-[10px] font-bold">Allenamento</span>
            <span v-if="activeTab === 'allenamento'" class="w-1.5 h-1.5 bg-arancione rounded-full absolute bottom-0"></span>
          </button>

          <!-- Nutrizione (Salvia) -->
          <button @click="activeTab = 'nutrition'" :class="activeTab === 'nutrition' ? 'text-salvia' : 'text-gray-400 hover:text-gray-500'" class="flex flex-col items-center gap-1 transition-all p-2 relative flex-1 group">
            <div :class="activeTab === 'nutrition' ? 'bg-salvia/10 text-salvia' : 'group-hover:bg-gray-100'" class="p-1.5 rounded-xl transition-colors">
              <svg class="w-6 h-6" stroke="currentColor" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 16h14M4 12h16c0-3.314-3.582-6-8-6S4 8.686 4 12zm0 4h16c0 1.105-.895 2-2 2H6c-1.105 0-2-.895-2-2z"/></svg>
            </div>
            <span class="text-[10px] font-bold">Nutrizione</span>
            <span v-if="activeTab === 'nutrition'" class="w-1.5 h-1.5 bg-salvia rounded-full absolute bottom-0"></span>
          </button>
          
          <!-- Progressi (Viola) -->
          <button @click="activeTab = 'progress'" :class="activeTab === 'progress' ? 'text-viola' : 'text-gray-400 hover:text-gray-500'" class="flex flex-col items-center gap-1 transition-all p-2 relative flex-1 group">
            <div :class="activeTab === 'progress' ? 'bg-viola/10 text-viola' : 'group-hover:bg-gray-100'" class="p-1.5 rounded-xl transition-colors">
              <svg class="w-6 h-6" stroke="currentColor" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </div>
            <span class="text-[10px] font-bold">Progressi</span>
            <span v-if="activeTab === 'progress'" class="w-1.5 h-1.5 bg-viola rounded-full absolute bottom-0"></span>
          </button>
        </nav>
      </template>

  </div>

  <!-- VUE APPLICATION LOGIC -->
  <script>
    // Vue Application Setup
    const { createApp, ref, onMounted, watch, nextTick, computed } = Vue;

    createApp({
      setup() {
        // App State
        const activeTab = ref('dashboard');
        
        // Auth State
        const isAuthenticated = ref(false);
        const authLoading = ref(true); // Start loading while checking auth

        // Nutrition Feature States
        const nutritionView = ref('list'); // 'list', 'detail', 'calendar', 'create', 'builder'
        
        // Modals State
        const customModal = ref({ isOpen: false, type: 'alert', title: '', message: '', onConfirm: null });
        const commentModal = ref({ isOpen: false, date: null, key: null, text: '' });
        const groceryModal = ref({ isOpen: false });
        
        // Toast Notification State (Simple)
        const showToastMessage = (msg) => {
           // Replacing native alerts with a simple custom modal alert
           customModal.value = { isOpen: true, type: 'alert', title: 'Notifica', message: msg, onConfirm: null };
        };

        const showConfirm = (title, message, onConfirmCallback) => {
            customModal.value = { isOpen: true, type: 'confirm', title, message, onConfirm: onConfirmCallback };
        }

        const executeConfirm = () => {
            if (customModal.value.onConfirm) customModal.value.onConfirm();
            customModal.value.isOpen = false;
        }

        // App Features State
        const showGroceryReminder = ref(true);
        const mealsContainer = ref(null);
        const currentMealId = ref(null);

        const weekDays = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
        const mealTypes = [
          { id: 'colazione', label: 'Colazione', icon: '🥣' },
          { id: 'spuntino_mattina', label: 'Spuntino Mattina', icon: '🍏' },
          { id: 'pranzo', label: 'Pranzo', icon: '🍗' },
          { id: 'spuntino_pomeriggio', label: 'Spuntino Pom.', icon: '🍌' },
          { id: 'post_workout', label: 'Post Workout', icon: '💪' },
          { id: 'cena', label: 'Cena', icon: '🐟' }
        ];

        // Legacy Fallback Meals (usati se non ci sono piani attivi custom)
        const meals = ref([
          { id: 'colazione', name: 'Colazione', calories: 450, icon: '🥣', description: 'Porridge d\'avena, yogurt greco 0%, frutti di bosco.' },
          { id: 'pranzo', name: 'Pranzo', calories: 650, icon: '🍗', description: 'Riso basmati, petto di pollo, zucchine grigliate.' }
        ]);

        const scrollToCurrentMeal = () => {
          nextTick(() => {
            const currentHour = new Date().getHours();
            if (currentHour >= 5 && currentHour < 10) currentMealId.value = 'colazione';
            else if (currentHour >= 10 && currentHour < 12) currentMealId.value = 'spuntino_mattina';
            else if (currentHour >= 12 && currentHour < 15) currentMealId.value = 'pranzo';
            else if (currentHour >= 15 && currentHour < 19) currentMealId.value = 'spuntino_pomeriggio';
            else if (currentHour >= 19 && currentHour < 21) currentMealId.value = 'cena';
            else currentMealId.value = 'post_workout';

            if (!mealsContainer.value) return;
            // Tenta di scrollare al pasto con l'id (usando l'id standard se presente nel piano di oggi)
            const targetElement = document.querySelector(`[id^='meal-${currentMealId.value}']`);
            if (targetElement) {
              const scrollPos = targetElement.offsetLeft - mealsContainer.value.offsetLeft - 20;
              mealsContainer.value.scrollTo({ left: scrollPos, behavior: 'smooth' });
            }
          });
        };

        // Nutritional Plans Logic
        const savedPlans = localStorage.getItem('still_plans');
        const defaultPlans = [
          { 
            id: 2, name: 'Definizione Avanzata', status: 'active', results: 'In corso (-1.2kg)', 
            startDate: '2026-10-15', endDate: '2026-11-30',
            grocery: ['Porridge', 'Yogurt Greco', 'Pollo', 'Riso Basmati', 'Salmone'],
            weeks: [], // Lasciamo vuoto per il fallback al legacy in dettaglio
            meals: [ // Legacy array per mantenere compatibilità finché non crei un piano col builder
               { id: 'colazione', name: 'Colazione', calories: 450, icon: '🥣', description: 'Porridge e yogurt.' },
               { id: 'pranzo', name: 'Pranzo', calories: 650, icon: '🍗', description: 'Pollo e riso.' }
            ] 
          }
        ];
        
        const plans = ref(savedPlans ? JSON.parse(savedPlans) : defaultPlans);

        // Auto-salvataggio dei piani nella memoria del telefono
        watch(plans, (newPlans) => {
          localStorage.setItem('still_plans', JSON.stringify(newPlans));
        }, { deep: true });
        
        const selectedPlan = ref(null);
        
        // Builder Data State
        const editingPlanId = ref(null);
        const newPlanData = ref({ name: '', startDate: '', endDate: '', makeActive: true });
        const newPlanBuilder = ref({ currentWeekIdx: 0, currentDay: 'Lunedì', weeks: [] });

        const createEmptyWeek = () => {
          const daysObj = {};
          weekDays.forEach(d => daysObj[d] = []);
          return { days: daysObj };
        };

        const startNewPlan = () => {
          editingPlanId.value = null;
          const today = new Date();
          const nextMonth = new Date(today);
          nextMonth.setMonth(today.getMonth() + 1);

          newPlanData.value = {
            name: '', startDate: today.toISOString().split('T')[0], endDate: nextMonth.toISOString().split('T')[0], makeActive: true
          };
          nutritionView.value = 'create';
        };

        const editPlan = (plan) => {
          editingPlanId.value = plan.id;
          newPlanData.value = {
            name: plan.name,
            startDate: plan.startDate,
            endDate: plan.endDate,
            makeActive: plan.status === 'active'
          };
          
          if (plan.weeks && plan.weeks.length > 0) {
            // Carica la struttura esistente copiandola in profondità
            newPlanBuilder.value = {
              currentWeekIdx: 0,
              currentDay: 'Lunedì',
              weeks: JSON.parse(JSON.stringify(plan.weeks))
            };
          } else {
            // Se si tenta di modificare un piano "legacy", inizializza vuoto
            newPlanBuilder.value = {
              currentWeekIdx: 0,
              currentDay: 'Lunedì',
              weeks: [createEmptyWeek()]
            };
          }
          
          nutritionView.value = 'create';
        };

        const goToBuilder = () => {
          if (!newPlanData.value.name.trim()) return showToastMessage("Dai un nome al tuo nuovo piano!");
          if (!newPlanData.value.startDate || !newPlanData.value.endDate) return showToastMessage("Inserisci date valide.");
          
          // Inizializza il builder solo se stiamo creando un piano ex-novo, 
          // se stiamo modificando (editingPlanId != null) manteniamo la struttura pre-caricata in editPlan()
          if (editingPlanId.value === null && (!newPlanBuilder.value.weeks || newPlanBuilder.value.weeks.length === 0)) {
            newPlanBuilder.value = {
              currentWeekIdx: 0,
              currentDay: 'Lunedì',
              weeks: [createEmptyWeek()]
            };
          }
          nutritionView.value = 'builder';
        };

        const addWeekToBuilder = () => newPlanBuilder.value.weeks.push(createEmptyWeek());
        
        const currentBuilderMeals = computed(() => {
           return newPlanBuilder.value.weeks[newPlanBuilder.value.currentWeekIdx].days[newPlanBuilder.value.currentDay];
        });

        const addMealToBuilder = () => {
           const currentDayMeals = newPlanBuilder.value.weeks[newPlanBuilder.value.currentWeekIdx].days[newPlanBuilder.value.currentDay];
           let nextType = mealTypes[0].id; // Predefinito: Colazione
           
           // Se ci sono già pasti in questo giorno, trova il tipo dell'ultimo inserito
           if (currentDayMeals.length > 0) {
             const lastMealType = currentDayMeals[currentDayMeals.length - 1].type;
             const lastIndex = mealTypes.findIndex(t => t.id === lastMealType);
             
             // Se non è l'ultimo tipo della lista, imposta quello successivo
             if (lastIndex !== -1 && lastIndex < mealTypes.length - 1) {
               nextType = mealTypes[lastIndex + 1].id;
             }
           }

           currentDayMeals.push({
             type: nextType, items: ['']
           });
        };

        const removeMealFromBuilder = (idx) => {
           newPlanBuilder.value.weeks[newPlanBuilder.value.currentWeekIdx].days[newPlanBuilder.value.currentDay].splice(idx, 1);
        };

        const addSlotToMeal = (meal) => {
          meal.items.push('');
        };

        const removeSlotFromMeal = (meal, idx) => {
          meal.items.splice(idx, 1);
        };

        const isPlanBuilderComplete = computed(() => {
          if (!newPlanBuilder.value || !newPlanBuilder.value.weeks || newPlanBuilder.value.weeks.length === 0) return false;
          
          for (let wIdx = 0; wIdx < newPlanBuilder.value.weeks.length; wIdx++) {
            const week = newPlanBuilder.value.weeks[wIdx];
            for (let dIdx = 0; dIdx < weekDays.length; dIdx++) {
              const day = weekDays[dIdx];
              if (!week.days[day] || week.days[day].length === 0) {
                return false;
              }
            }
          }
          return true;
        });

        const executeSavePlan = () => {
          if (newPlanData.value.makeActive) {
            plans.value.forEach(p => {
              if (p.status === 'active') { p.status = 'inactive'; p.results = 'Terminato'; }
            });
          }

          // [NUOVO] Generazione dinamica Lista della Spesa da tutti gli alimenti inseriti!
          const uniqueItems = new Set();
          newPlanBuilder.value.weeks.forEach(week => {
            Object.values(week.days).forEach(dayMeals => {
              dayMeals.forEach(meal => {
                meal.items.forEach(item => {
                  const trimmed = item.trim();
                  if (trimmed) uniqueItems.add(trimmed);
                });
              });
            });
          });
          const generatedGroceryList = Array.from(uniqueItems);

          // Genera un menu "legacy compatibile" per il dettaglio prendendo i pasti del Lunedì della prima settimana
          const mockMealsForDetail = [];
          if (newPlanBuilder.value.weeks[0].days['Lunedì']) {
             newPlanBuilder.value.weeks[0].days['Lunedì'].forEach((m, i) => {
               const tInfo = mealTypes.find(t => t.id === m.type) || mealTypes[0];
               mockMealsForDetail.push({
                 id: m.type + '_' + i, name: tInfo.label, icon: tInfo.icon, calories: '-', 
                 description: m.items.filter(it => it.trim()!=='').join(', ') || 'Nessun dettaglio'
               });
             });
          }

          if (editingPlanId.value !== null) {
            // Modifica piano esistente
            const planToUpdate = plans.value.find(p => p.id === editingPlanId.value);
            if (planToUpdate) {
              planToUpdate.name = newPlanData.value.name;
              if (newPlanData.value.makeActive) {
                planToUpdate.status = 'active';
                planToUpdate.results = 'In corso';
              } else if (planToUpdate.status === 'active') {
                planToUpdate.status = 'inactive';
                planToUpdate.results = 'Terminato';
              }
              planToUpdate.startDate = newPlanData.value.startDate;
              planToUpdate.endDate = newPlanData.value.endDate;
              planToUpdate.grocery = generatedGroceryList.length > 0 ? generatedGroceryList : ['Nessun alimento inserito'];
              planToUpdate.weeks = JSON.parse(JSON.stringify(newPlanBuilder.value.weeks));
              planToUpdate.meals = mockMealsForDetail;
            }
            showToastMessage(`Piano "${newPlanData.value.name}" modificato con successo! ✏️`);
            editingPlanId.value = null; // Resetta stato
          } else {
            // Creazione nuovo piano
            const nextId = Math.max(...plans.value.map(p => p.id), 0) + 1;
            plans.value.unshift({
              id: nextId,
              name: newPlanData.value.name,
              status: newPlanData.value.makeActive ? 'active' : 'inactive',
              results: newPlanData.value.makeActive ? 'Appena Iniziato' : 'In Programma',
              startDate: newPlanData.value.startDate,
              endDate: newPlanData.value.endDate,
              grocery: generatedGroceryList.length > 0 ? generatedGroceryList : ['Nessun alimento inserito'],
              weeks: JSON.parse(JSON.stringify(newPlanBuilder.value.weeks)), // Salva struttura complessa
              meals: mockMealsForDetail // Fallback per le vecchie viste
            });
            showToastMessage(`Piano "${newPlanData.value.name}" creato con successo! 🚀`);
          }

          nutritionView.value = 'list';
        };

        const finalizeNewPlan = () => {
          // VALIDAZIONE: Controllo che tutti i giorni di tutte le settimane abbiano almeno un pasto
          let hasEmptyDays = false;
          let firstEmptyDayMsg = '';

          for (let wIdx = 0; wIdx < newPlanBuilder.value.weeks.length; wIdx++) {
            const week = newPlanBuilder.value.weeks[wIdx];
            for (let dIdx = 0; dIdx < weekDays.length; dIdx++) {
              const day = weekDays[dIdx];
              if (!week.days[day] || week.days[day].length === 0) {
                hasEmptyDays = true;
                firstEmptyDayMsg = `Settimana ${wIdx + 1}: manca il menù di ${day}.`;
                break;
              }
            }
            if (hasEmptyDays) break;
          }

          if (hasEmptyDays) {
            // Blocca il salvataggio se manca qualche giorno
            showToastMessage(`Devi inserire i pasti per tutta la settimana prima di salvare! 🛑 ${firstEmptyDayMsg}`);
            return;
          }

          // CONFERMA: Se tutto è compilato, chiedi conferma
          const confirmTitle = editingPlanId.value ? "Salva Modifiche" : "Salva Piano Definitivo";
          const confirmMsg = editingPlanId.value 
             ? "Sei sicuro di voler salvare le modifiche a questo piano?" 
             : "Hai completato l'inserimento? Sei sicuro di voler salvare e attivare questo nuovo piano?";
             
          showConfirm(confirmTitle, confirmMsg, () => {
               executeSavePlan();
          });
        };

        const promptDeletePlan = () => {
          showConfirm("Elimina Piano", "Sei sicuro di voler eliminare definitivamente questo piano? L'azione non è reversibile.", () => {
             deletePlan();
          });
        };

        const deletePlan = () => {
          if (editingPlanId.value !== null) {
            const index = plans.value.findIndex(p => p.id === editingPlanId.value);
            if (index > -1) {
              plans.value.splice(index, 1);
              showToastMessage(`Piano eliminato con successo. 🗑️`);
              editingPlanId.value = null;
              nutritionView.value = 'list';
            }
          }
        };

        const activePlan = computed(() => plans.value.find(p => p.status === 'active'));

        // Computed per Dashboard: Prende i pasti di "oggi" reali dal piano attivo
        const todayActiveMeals = computed(() => {
          if (!activePlan.value) return meals.value; // Fallback generico

          // Se il piano ha la struttura a settimane (creata dal nuovo builder)
          if (activePlan.value.weeks && activePlan.value.weeks.length > 0) {
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Azzera l'ora per evitare calcoli errati
            
            const startDate = new Date(activePlan.value.startDate);
            startDate.setHours(0, 0, 0, 0);

            let weeksElapsed = 0;
            // Calcola le settimane passate solo se il piano è già iniziato
            if (today >= startDate) {
               const diffTime = today.getTime() - startDate.getTime();
               const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
               weeksElapsed = Math.floor(diffDays / 7);
            }

            const weekIdx = weeksElapsed % activePlan.value.weeks.length;
            const dayOfWeek = today.getDay(); // 0 Domenica, 1 Lunedì...
            const mappedDay = dayOfWeek === 0 ? 'Domenica' : weekDays[dayOfWeek - 1];

            const dayMeals = activePlan.value.weeks[weekIdx].days[mappedDay] || [];
            
            return dayMeals.map((m, i) => {
              const typeInfo = mealTypes.find(t => t.id === m.type) || mealTypes[0];
              return {
                id: m.type + '_' + i,
                name: typeInfo.label,
                icon: typeInfo.icon,
                calories: '-',
                description: m.items.filter(it => it.trim() !== '').join(', ') || 'Nessun dettaglio.'
              }
            });
          } 
          
          // Fallback ai mock del piano (vecchio formato)
          return activePlan.value.meals || meals.value;
        });
        
        const checklistItems = ref([]);

        // [NUOVO] Calcola solo la spesa di domani
        const getTomorrowGrocery = (plan) => {
          if (!plan) return [];
          
          if (plan.weeks && plan.weeks.length > 0) {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            
            const startDate = new Date(plan.startDate);
            startDate.setHours(0, 0, 0, 0);

            let weeksElapsed = 0;
            if (tomorrow >= startDate) {
               const diffTime = tomorrow.getTime() - startDate.getTime();
               const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
               weeksElapsed = Math.floor(diffDays / 7);
            }

            const weekIdx = weeksElapsed % plan.weeks.length;
            const dayOfWeek = tomorrow.getDay(); // 0 Domenica, 1 Lunedì...
            const mappedDay = dayOfWeek === 0 ? 'Domenica' : weekDays[dayOfWeek - 1];

            const tomorrowMeals = plan.weeks[weekIdx].days[mappedDay] || [];
            const uniqueItems = new Set();
            tomorrowMeals.forEach(meal => {
               meal.items.forEach(item => {
                  const trimmed = item.trim();
                  if (trimmed) uniqueItems.add(trimmed);
               });
            });
            return Array.from(uniqueItems);
          }
          return plan.grocery || []; // legacy fallback
        };

        const openGroceryModal = () => {
           const itemsForTomorrow = getTomorrowGrocery(activePlan.value);
           
           // Mantiene la spunta sugli elementi che avevi già checkato prima di chiudere la modale
           const currentChecked = new Set(checklistItems.value.filter(i => i.checked).map(i => i.name));
           
           checklistItems.value = itemsForTomorrow.map(itemName => ({
               name: itemName,
               checked: currentChecked.has(itemName)
           }));
           
           if(checklistItems.value.length === 0) {
              showToastMessage("Nessun pasto programmato per domani. Giornata libera!");
              return;
           }

           groceryModal.value.isOpen = true;
        };
        
        const sortedPlans = computed(() => {
          return [...plans.value].sort((a, b) => {
            if (a.status === 'active') return -1;
            if (b.status === 'active') return 1;
            return b.id - a.id;
          });
        });

        const selectedPlanTotalCalories = computed(() => {
          if (!selectedPlan.value) return 0;
          return selectedPlan.value.meals.reduce((sum, meal) => sum + meal.calories, 0);
        });

        const openPlan = (plan) => {
          selectedPlan.value = plan;
          nutritionView.value = 'detail';
        };

        const formatDate = (dateStr) => {
          const d = new Date(dateStr);
          return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        };

        // Clipboard Sharing
        const copyToClipboard = async (text, successMsg) => {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
            } else {
              let textArea = document.createElement("textarea");
              textArea.value = text;
              textArea.style.position = "fixed";
              textArea.style.left = "-999999px";
              textArea.style.top = "-999999px";
              document.body.appendChild(textArea);
              textArea.focus();
              textArea.select();
              document.execCommand('copy');
              textArea.remove();
            }
            showToastMessage(successMsg);
          } catch (err) {
            console.error('Failed to copy: ', err);
            showToastMessage("Errore durante la copia.");
          }
        };

        const sharePendingGrocery = () => {
          const pending = checklistItems.value.filter(item => !item.checked).map(item => item.name);
          if(pending.length === 0) {
             showToastMessage("Hai già tutto! Frigo al completo. 🚀");
             groceryModal.value.isOpen = false;
             return;
          }
          const text = `🛒 *Spesa STILL - Mancanti*\n\nMi manca da comprare:\n- ${pending.join('\n- ')}\n\nIl frigo piange, aiutiamolo! 🏃‍♂️💨`;
          copyToClipboard(text, "Lista della spesa (da comprare) copiata negli appunti!");
          groceryModal.value.isOpen = false;
        };

        // Plan Actions
        const promptTerminatePlan = () => {
          showConfirm("Termina Piano", "Sei sicuro di voler terminare il piano attualmente attivo?", () => {
             selectedPlan.value.status = 'inactive';
             selectedPlan.value.results = 'Terminato';
             showToastMessage("Piano terminato con successo.");
          });
        };

        const reactivatePlan = (planToActivate) => {
          const currentActive = plans.value.find(p => p.status === 'active');
          if (currentActive) {
            showToastMessage("C'è un piano già attivo. Disattivalo prima di poterne attivare uno nuovo.");
            return;
          }
          planToActivate.status = 'active';
          planToActivate.results = 'In corso';
          showToastMessage(`Piano "${planToActivate.name}" riattivato.`);
        };


        // Calendar Logic
        const todayDate = new Date();
        const currentYear = ref(todayDate.getFullYear());
        const currentMonth = ref(todayDate.getMonth());
        
        const currentMonthName = computed(() => {
          return new Intl.DateTimeFormat('it-IT', { month: 'long' }).format(new Date(currentYear.value, currentMonth.value, 1));
        });
        
        const daysInMonth = computed(() => {
          return new Date(currentYear.value, currentMonth.value + 1, 0).getDate();
        });
        
        const firstDayOfMonth = computed(() => {
          let firstDay = new Date(currentYear.value, currentMonth.value, 1).getDay();
          return firstDay === 0 ? 6 : firstDay - 1; 
        });

        const nextMonth = () => {
          if (currentMonth.value === 11) {
            currentMonth.value = 0;
            currentYear.value++;
          } else {
            currentMonth.value++;
          }
        };

        const prevMonth = () => {
          if (currentMonth.value === 0) {
            currentMonth.value = 11;
            currentYear.value--;
          } else {
            currentMonth.value--;
          }
        };

        const exportMode = ref(false);
        const exportSelectedDates = ref([]);
        
        // Setup initial note for today to demonstrate the feature
        const savedComments = localStorage.getItem('still_comments');
        const initComments = {};
        initComments[`${todayDate.getFullYear()}-${todayDate.getMonth()}-${todayDate.getDate()}`] = "Oggi mi sento pieno di energia, ricordiamoci di bere più acqua tra un pasto e l'altro!";
        
        const commentsMap = ref(savedComments ? JSON.parse(savedComments) : initComments);

        // Auto-salvataggio delle note nella memoria del telefono
        watch(commentsMap, (newComments) => {
          localStorage.setItem('still_comments', JSON.stringify(newComments));
        }, { deep: true });

        const noteForToday = computed(() => {
          return commentsMap.value[`${todayDate.getFullYear()}-${todayDate.getMonth()}-${todayDate.getDate()}`];
        });

        const isToday = (day) => {
          return day === todayDate.getDate() && currentMonth.value === todayDate.getMonth() && currentYear.value === todayDate.getFullYear();
        };

        const isSunday = (day) => {
          return new Date(currentYear.value, currentMonth.value, day).getDay() === 0;
        };

        const hasComment = (day) => !!commentsMap.value[`${currentYear.value}-${currentMonth.value}-${day}`];

        const handleDayClick = (day) => {
          if (exportMode.value) {
            const index = exportSelectedDates.value.indexOf(day);
            if (index > -1) {
              exportSelectedDates.value.splice(index, 1);
            } else {
              exportSelectedDates.value.push(day);
              exportSelectedDates.value.sort((a,b) => a - b);
            }
          } else {
            commentModal.value.date = day;
            commentModal.value.key = `${currentYear.value}-${currentMonth.value}-${day}`;
            commentModal.value.text = commentsMap.value[commentModal.value.key] || '';
            commentModal.value.isOpen = true;
          }
        };

        const closeCommentModal = () => {
          commentModal.value.isOpen = false;
        };

        const saveComment = () => {
          if (commentModal.value.text.trim() === '') {
            delete commentsMap.value[commentModal.value.key];
          } else {
            commentsMap.value[commentModal.value.key] = commentModal.value.text;
          }
          closeCommentModal();
        };

        const exportSelectedMenu = () => {
           if(exportSelectedDates.value.length === 0 || !selectedPlan.value) return;
           
           let text = `🗓️ *Menù STILL - Esportazione Giornate*\n\n`;
           
           exportSelectedDates.value.forEach(day => {
              text += `--- Giorno ${day} ${currentMonthName.value} ---\n`;
              selectedPlan.value.meals.forEach(m => {
                text += `🔸 ${m.name} (${m.calories} kcal)\n   ${m.description}\n`;
              });
              const key = `${currentYear.value}-${currentMonth.value}-${day}`;
              if(commentsMap.value[key]) {
                 text += `💡 Nota: ${commentsMap.value[key]}\n`;
              }
              text += `\n`;
           });

           text += `Totale giornaliero: ${selectedPlanTotalCalories.value} kcal\n`;
           text += `STILL App. Ancora in movimento.`;

           copyToClipboard(text, `Menù di ${exportSelectedDates.value.length} giorni copiato negli appunti!`);
           exportMode.value = false;
           exportSelectedDates.value = [];
        };

        // Watchers
        watch(activeTab, (newTab) => {
          if (newTab === 'dashboard') {
            scrollToCurrentMeal();
          }
        });

        // Lifecycle Hooks: avvio diretto in modalità demo, senza autenticazione esterna
        onMounted(() => {
          authLoading.value = false;
        });

        // Methods: accesso dimostrativo locale, senza account
        const login = async () => {
          authLoading.value = true;
          setTimeout(() => {
            isAuthenticated.value = true;
            authLoading.value = false;
            if (activeTab.value === 'dashboard') scrollToCurrentMeal();
          }, 300);
        };

        const logout = async () => {
          isAuthenticated.value = false;
          activeTab.value = 'dashboard';
        };

        return {
          activeTab,
          isAuthenticated,
          authLoading,
          showGroceryReminder,
          mealsContainer,
          currentMealId,
          todayActiveMeals,
          login,
          logout,
          nutritionView,
          sortedPlans,
          selectedPlan,
          editingPlanId, // <-- Esportato per poterlo usare in HTML
          newPlanData,
          startNewPlan,
          editPlan,      // <-- Esportato per poterlo usare in HTML
          goToBuilder,
          newPlanBuilder,
          weekDays,
          mealTypes,
          addWeekToBuilder,
          currentBuilderMeals,
          addMealToBuilder,
          removeMealFromBuilder,
          addSlotToMeal,
          removeSlotFromMeal,
          isPlanBuilderComplete,
          finalizeNewPlan,
          promptDeletePlan,
          selectedPlanTotalCalories,
          openPlan,
          formatDate,
          sharePendingGrocery,
          promptTerminatePlan,
          reactivatePlan,
          currentYear,
          currentMonth,
          currentMonthName,
          daysInMonth,
          firstDayOfMonth,
          nextMonth,
          prevMonth,
          exportMode,
          exportSelectedDates,
          isToday,
          isSunday,
          hasComment,
          handleDayClick,
          exportSelectedMenu,
          noteForToday,
          customModal,
          executeConfirm,
          commentModal,
          closeCommentModal,
          saveComment,
          activePlan,
          groceryModal,
          openGroceryModal,
          checklistItems
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
