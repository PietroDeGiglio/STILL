<!DOCTYPE html>
<html lang="it" class="h-full bg-[#F6F5F2]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STILL - IERI. OGGI. DOMANI.</title>
  
  <!-- App Icon / Favicon (Versione Sfondo Nero) -->
  <link rel="icon" href="icona.png" type="image/png">
  <link rel="apple-touch-icon" href="icona.png">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            antracite: '#1D1D1D',
            salvia: '#10B981', /* Verde più vivace e allegro (Smeraldo) */
            viola: '#8B5CF6',  /* Viola più luminoso e vibrante */
            arancione: '#F5A623',
            bianco: '#F6F5F2'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          boxShadow: {
            'soft': '0 4px 20px rgba(0, 0, 0, 0.05)',
            'salvia-glow': '0 0 15px rgba(16, 185, 129, 0.4)'
          }
        }
      }
    }
  </script>
  
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #10B981; }
    
    button, a, input { -webkit-tap-highlight-color: transparent; }

    .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Hide scrollbar for the horizontal slider */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animazione Gradiente Cangiante per STILL & Pulsante */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .cangiante-text {
      background: linear-gradient(135deg, #20C997, #F5A623, #7A4DF1, #20C997);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite;
    }
    
    .cangiante-btn {
      background: linear-gradient(135deg, #20C997, #F5A623, #7A4DF1, #20C997);
      background-size: 300% 300%;
      animation: gradientShift 6s ease infinite;
    }
    
    /* Animazioni fluttuanti (Soft & separate) per gli aloni */
    @keyframes pulseSoft1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate(10px, 15px) scale(1.05); opacity: 0.9; }
    }
    @keyframes pulseSoft2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate(-15px, 10px) scale(1.05); opacity: 0.9; }
    }
    @keyframes pulseSoft3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate(10px, -15px) scale(1.05); opacity: 0.9; }
    }
    .animate-float-1 { animation: pulseSoft1 8s ease-in-out infinite; }
    .animate-float-2 { animation: pulseSoft2 9s ease-in-out infinite; }
    .animate-float-3 { animation: pulseSoft3 10s ease-in-out infinite; }

    /* Classe per la maschera del Logo (Sicura per GitHub) */
    .logo-mask {
      -webkit-mask-image: url('LOGO.svg');
      mask-image: url('LOGO.svg');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }
  </style>
</head>

<body class="h-full font-sans text-antracite antialiased selection:bg-salvia selection:text-white bg-gray-100 flex justify-center">

  <div id="app" class="w-full sm:max-w-[420px] h-full sm:border-x sm:border-gray-200 shadow-2xl relative flex flex-col overflow-hidden bg-bianco">
      
      <!-- ==================== PUBLIC LANDING PAGE ==================== -->
      <div v-if="!isAuthenticated && !authLoading" class="flex-1 flex flex-col items-center justify-center p-6 space-y-8 animate-fadeIn relative overflow-hidden bg-bianco">
        <!-- Decorative Background (Aloni Soft, separati e non invasivi) -->
        <div class="absolute -top-10 -left-10 w-64 h-64 bg-salvia/15 rounded-full blur-[80px] animate-float-1 pointer-events-none"></div>
        <div class="absolute top-[35%] -right-10 w-64 h-64 bg-arancione/15 rounded-full blur-[80px] animate-float-2 pointer-events-none"></div>
        <div class="absolute -bottom-10 -left-10 w-72 h-72 bg-viola/15 rounded-full blur-[80px] animate-float-3 pointer-events-none"></div>

        <div class="relative z-10 flex flex-col items-center space-y-6 text-center w-full">
          <!-- Logo SVG Vettoriale Standalone (Senza sfondo o contorno bianco) -->
          <div class="w-36 h-36 flex items-center justify-center relative drop-shadow-md">
            <div class="w-full h-full cangiante-btn logo-mask"></div>
          </div>
          
          <div class="space-y-4 text-center w-full flex flex-col items-center justify-center">
            <!-- Titolo STILL Cangiante e perfettamente centrato -->
            <h1 class="text-4xl sm:text-5xl font-black tracking-[0.2em] text-center cangiante-text uppercase translate-x-[0.1em]">STILL</h1>
            
            <div class="font-extrabold space-y-2 text-center w-full flex flex-col items-center justify-center">
              <div class="text-xl tracking-wider text-center flex items-center justify-center gap-2 cangiante-text font-black">
                <span>IERI.</span> 
                <span>OGGI.</span> 
                <span>DOMANI.</span>
              </div>
              <div class="text-[12px] font-black uppercase tracking-widest text-center flex items-center justify-center gap-2 mt-1 cangiante-text">
                <span>ANCORA.</span> 
                <span>ANCORA.</span> 
                <span>ANCORA.</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Pulsante di Accedi Cangiante -->
        <div class="w-full relative z-10 pt-4 max-w-xs sm:max-w-none">
          <button @click="login" class="w-full cangiante-btn text-white font-extrabold py-4 rounded-2xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2 hover:opacity-95">
            <span>Accedi all'Area Privata</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
          <p class="text-center text-[10px] font-bold text-gray-400 tracking-widest mt-4">Powered by Pietro De Giglio</p>
        </div>
      </div>

      <!-- Loading State -->
      <div v-else-if="authLoading" class="flex-1 flex items-center justify-center">
        <div class="w-8 h-8 border-4 border-salvia border-t-transparent rounded-full animate-spin"></div>
      </div>

      <!-- ==================== PRIVATE APP AREA ==================== -->
      <template v-else>
        <!-- HEADER -->
        <header class="bg-bianco/90 backdrop-blur-md px-5 py-3 flex items-center justify-between border-b border-gray-200 z-20 sticky top-0">
          <!-- Profile/Menu Trigger -->
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-salvia/20 text-salvia flex items-center justify-center font-bold text-sm border border-salvia/30">
              P
            </div>
          </div>

          <!-- Brand Logo Mini Vettoriale (Senza box bianco) -->
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 flex items-center justify-center">
              <div class="w-full h-full cangiante-btn logo-mask"></div>
            </div>
            <span class="font-extrabold text-base tracking-[0.2em] cangiante-text">STILL</span>
          </div>

          <!-- Logout Button -->
        <button @click="logout" class="p-2 rounded-xl bg-white hover:bg-gray-100 text-gray-600 border border-gray-200 transition-all" aria-label="Logout">
          <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </header>

      <!-- MAIN SCROLLABLE CONTENT BODY -->
      <main class="flex-1 overflow-y-auto px-5 py-5 space-y-6 pb-32 relative">

        <!-- ==================== DASHBOARD ==================== -->
        <div v-if="activeTab === 'dashboard'" class="space-y-6 animate-fadeIn">
            
            <!-- QUOTE BANNER (Moved to top) -->
            <div class="bg-antracite rounded-2xl p-5 shadow-lg relative overflow-hidden">
              <svg class="absolute right-0 top-0 w-32 h-32 text-white/5" fill="currentColor" viewBox="0 0 100 100"><path d="M 10 90 L 50 30 L 90 90 Z"/></svg>
              <p class="relative z-10 text-sm font-semibold italic text-bianco leading-snug">
                "NON CONTA DA DOVE PARTI. CONTA DOVE <span class="text-salvia font-bold uppercase not-italic">DECIDI DI ANDARE.</span>"
              </p>
            </div>

            <!-- User Greeting -->
            <div class="space-y-1">
              <h1 class="text-3xl font-bold tracking-tight text-antracite">Ciao Pietro,</h1>
              <p class="text-sm text-gray-500 font-medium">Ogni giorno è un passo avanti verso la vetta.</p>
            </div>

            <!-- APPUNTI DI OGGI (Visibile solo se c'è una nota) -->
            <div v-if="noteForToday" class="bg-sky-500/10 border border-sky-500/30 rounded-2xl p-4 flex gap-3 items-start shadow-sm mt-4 animate-fadeIn">
              <div class="text-sky-600 text-xl pt-0.5">💡</div>
              <div>
                <div class="text-[10px] font-bold text-sky-600 uppercase tracking-widest mb-1">La tua nota di oggi</div>
                <p class="text-sm text-antracite font-medium leading-relaxed">{{ noteForToday }}</p>
              </div>
            </div>

            <!-- GROCERY BANNER (DASHBOARD) -->
            <div v-if="activePlan" @click="openGroceryModal"
                 class="rounded-3xl p-4 flex gap-4 items-center shadow-sm cursor-pointer transition-all mt-4 animate-fadeIn border"
                 :class="allGroceryChecked ? 'bg-salvia/10 border-salvia/30 hover:bg-salvia/15' : 'bg-viola/10 border-viola/30 hover:bg-viola/15'">
              <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl flex-shrink-0"
                   :class="allGroceryChecked ? 'bg-salvia/20' : 'bg-viola/20'">🛒</div>
              <div class="flex-1">
                <h4 class="text-sm font-extrabold leading-tight"
                    :class="allGroceryChecked ? 'text-salvia' : 'text-viola'">
                  {{ allGroceryChecked ? 'Il tuo frigo è pronto!' : 'Il tuo frigo è pronto per domani?' }}
                </h4>
                <p class="text-[11px] text-antracite font-medium mt-1 leading-snug">
                  {{ allGroceryChecked ? 'Tocca qui se hai dimenticato qualcosa o per correggere la checklist.' : 'Tocca qui per la checklist e condividi quello che ti manca.' }}
                </p>
              </div>
              <div :class="allGroceryChecked ? 'text-salvia' : 'text-viola'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </div>
            </div>

            <!-- HORIZONTAL MEALS SLIDER -->
            <div class="space-y-3">
              <div class="flex justify-between items-center px-1">
                <h3 class="text-lg font-bold text-antracite">Il tuo menù di oggi</h3>
              </div>
              
              <div v-if="todayActiveMeals.length === 0" class="bg-white rounded-3xl p-5 border border-gray-100 shadow-soft text-center mx-1">
                <p class="text-sm text-gray-500 font-medium">Riposo o nessun pasto programmato per oggi.</p>
              </div>

              <div v-else ref="mealsContainer" id="meals-container" class="flex overflow-x-auto snap-x snap-mandatory hide-scrollbar gap-4 pb-2 pt-1 px-1">
                <div v-for="meal in todayActiveMeals" :key="meal.id" :id="'meal-' + meal.id"
                     class="snap-center shrink-0 w-[85%] bg-white rounded-3xl border shadow-soft relative overflow-hidden flex items-stretch transition-all"
                     :class="currentMealId === meal.id.split('_')[0] ? 'border-salvia ring-4 ring-salvia/10' : 'border-gray-100'">

                  <!-- Etichetta Pasto Attuale -->
                  <div v-if="currentMealId === meal.id.split('_')[0]" class="absolute top-0 right-12 bg-salvia text-white text-[9px] font-bold uppercase tracking-wider px-3 py-1 rounded-bl-xl">
                    Ora
                  </div>

                  <!-- CONTENUTO PASTO -->
                  <div class="flex-1 min-w-0 p-5 pr-2 flex flex-col justify-between">
                    <div :class="currentMealId === meal.id.split('_')[0] ? 'pt-4' : ''">
                      <div class="flex items-center gap-3 mb-3">
                        <div class="w-12 h-12 rounded-2xl bg-salvia/10 flex items-center justify-center text-2xl border border-salvia/20">{{ meal.icon }}</div>
                        <div>
                          <h4 class="text-base font-extrabold text-antracite">{{ meal.name }}</h4>
                          <span class="text-[11px] font-bold text-salvia uppercase tracking-wider">
                            {{ meal.calories !== null ? meal.calories + ' kcal' : 'Calorie n.d.' }}
                          </span>
                        </div>
                      </div>
                      <p class="text-sm text-gray-500 font-medium leading-relaxed">{{ meal.description }}</p>
                    </div>
                  </div>

                  <!-- BARRA LATERALE: Eseguito / Saltato -->
                  <div class="w-12 flex-shrink-0 flex flex-col items-center justify-center gap-2.5 border-l border-gray-100">
                    <button @click="setMealDone(todayDateKey, meal)" aria-label="Pasto eseguito"
                            class="w-10 h-10 rounded-full flex items-center justify-center transition-all active:scale-90"
                            :class="todayMealLogs[meal.id]?.status === 'done' ? 'bg-salvia text-white shadow-sm' : 'bg-salvia/10 text-salvia/60 hover:bg-salvia/20 hover:text-salvia'">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </button>
                    <button @click="promptSkipMeal(todayDateKey, meal)" aria-label="Pasto saltato"
                            class="w-10 h-10 rounded-full flex items-center justify-center transition-all active:scale-90"
                            :class="todayMealLogs[meal.id]?.status === 'skipped' ? 'bg-red-500 text-white shadow-sm' : 'bg-red-50 text-red-300 hover:bg-red-100 hover:text-red-400'">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- QUICK STATS -->
            <div class="grid grid-cols-2 gap-4">
              <div @click="activeTab = 'progress'" class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm cursor-pointer hover:border-viola/50 transition-colors">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2 leading-tight">Variazione Peso</div>
                <template v-if="weightDelta">
                  <div class="flex items-baseline gap-1 mt-1">
                    <span class="text-2xl font-extrabold" :class="weightDelta.value <= 0 ? 'text-salvia' : 'text-arancione'">{{ formatNumber(weightDelta.value) }}</span>
                    <span class="text-sm font-semibold text-gray-500">kg</span>
                  </div>
                  <p class="text-[10px] font-bold text-gray-400 mt-1">{{ weightDelta.days }} giorni</p>
                </template>
                <template v-else>
                  <div class="text-sm font-bold text-gray-400 mt-2">Dati insufficienti</div>
                  <p class="text-[10px] font-bold text-gray-400 mt-1">Servono 2 misurazioni</p>
                </template>
              </div>

              <div @click="goToTodayNutrition()" class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm cursor-pointer hover:border-salvia/50 transition-colors flex flex-col justify-between">
                <div>
                  <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 leading-tight">Calorie Oggi</div>
                  <div class="flex items-baseline gap-1">
                    <span class="text-xl font-extrabold text-antracite">{{ todayConsumedCalories }}</span>
                    <span class="text-xs font-semibold text-gray-500">/ {{ todayTargetCalories }}</span>
                  </div>
                </div>
                <div class="mt-2 w-full bg-gray-100 h-1.5 rounded-full overflow-hidden">
                  <div class="bg-salvia h-full rounded-full transition-all" :style="{ width: todayCaloriesPct + '%' }"></div>
                </div>
              </div>
            </div>

            <!-- ALLENAMENTO DI OGGI (NEW PREVIEW) -->
            <div class="space-y-3">
              <div class="flex justify-between items-center px-1">
                <h3 class="text-lg font-bold text-antracite">Workout di oggi</h3>
                <span class="text-xs font-bold text-arancione bg-arancione/10 px-2 py-1 rounded-md">Push Upper</span>
              </div>
              
              <div @click="activeTab = 'allenamento'" class="bg-white rounded-3xl p-5 border border-gray-100 shadow-soft cursor-pointer hover:border-arancione/50 transition-colors flex items-center gap-4 relative overflow-hidden">
                <div class="absolute right-0 top-0 bottom-0 w-12 bg-arancione/5 flex items-center justify-center text-arancione">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-arancione/10 flex items-center justify-center text-arancione border border-arancione/20">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 6v12M17 6v12M3 9v6h4V9H3zm14 0v6h4V9h-4zM7 12h10"/></svg>
                </div>
                <div>
                  <h4 class="font-extrabold text-antracite">Allenamento Forza</h4>
                  <p class="text-xs text-gray-500 font-medium mt-0.5">4 Esercizi • 45 min stimati</p>
                </div>
              </div>
            </div>

            <!-- CALENDARIO PASTI -->
            <div class="space-y-3">
              <div class="flex justify-between items-center px-1 gap-2">
                <h3 class="text-lg font-bold text-antracite">Calendario pasti</h3>
                <div class="flex items-center gap-1.5 flex-shrink-0">
                  <button @click="dashPrevMonth" class="p-1.5 rounded-lg bg-gray-100 text-gray-500 hover:bg-gray-200 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                  </button>
                  <span class="text-xs font-bold text-antracite capitalize min-w-[92px] text-center">{{ dashMonthName }} {{ dashYear }}</span>
                  <button @click="dashNextMonth" class="p-1.5 rounded-lg bg-gray-100 text-gray-500 hover:bg-gray-200 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                  </button>
                </div>
              </div>

              <div class="bg-white rounded-3xl p-4 border border-gray-100 shadow-soft">
                <div class="grid grid-cols-7 gap-1 mb-1.5">
                  <div v-for="(label, idx) in ['L','M','M','G','V','S','D']" :key="'dow-' + idx" class="text-center text-[10px] font-bold text-gray-400 uppercase">{{ label }}</div>
                </div>
                <div class="grid grid-cols-7 gap-1">
                  <div v-for="n in dashFirstDayOfMonth" :key="'empty-' + n"></div>
                  <button v-for="day in dashDaysInMonth" :key="day" @click="openDayMenu(day)"
                          class="aspect-square rounded-xl text-xs font-bold transition-all flex items-center justify-center relative"
                          :class="dashboardDayClasses(day)">
                    {{ day }}
                    <div v-if="dashHasComment(day)" class="absolute bottom-1 w-1.5 h-1.5 bg-sky-500 rounded-full ring-1 ring-white/80 shadow-sm"></div>
                  </button>
                </div>

                <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mt-4 pt-4 border-t border-gray-100">
                  <div class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-salvia"></span>
                    <span class="text-[10px] font-bold text-gray-500">Perfetta</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                    <span class="text-[10px] font-bold text-gray-500">Sgarro</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-viola"></span>
                    <span class="text-[10px] font-bold text-gray-500">Piccolo sgarro</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-500"></span>
                    <span class="text-[10px] font-bold text-gray-500">Nota</span>
                  </div>
                </div>
              </div>
            </div>

          </div>

          <!-- ==================== ALLENAMENTO (NEW) ==================== -->
          <div v-if="activeTab === 'allenamento'" class="space-y-6 animate-fadeIn">
            <div>
              <div class="text-[10px] font-bold text-arancione tracking-widest uppercase">DISCIPLINA</div>
              <h2 class="text-2xl font-bold text-antracite">Allenamento</h2>
            </div>
            
            <div class="bg-white rounded-3xl p-8 border border-gray-100 shadow-soft text-center flex flex-col items-center justify-center space-y-4">
              <div class="w-16 h-16 bg-arancione/10 rounded-full flex items-center justify-center text-arancione border border-arancione/20">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 6v12M17 6v12M3 9v6h4V9H3zm14 0v6h4V9h-4zM7 12h10"/></svg>
              </div>
              <div>
                <h3 class="font-bold text-antracite text-lg">Work in Progress</h3>
                <p class="text-sm text-gray-500 mt-1">La sezione arancione dedicata ai tuoi workout sarà sviluppata qui a breve.</p>
              </div>
            </div>
          </div>

          <!-- ==================== PROGRESSI ==================== -->
          <div v-if="activeTab === 'progress'" class="space-y-6 animate-fadeIn">

            <div class="flex justify-between items-end gap-3">

                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>

                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
              </div>
              <div>
                <h3 class="font-bold text-antracite text-lg">Ancora nessun progresso</h3>
                <p class="text-sm text-gray-500 mt-1.5 leading-relaxed">Registra peso e circonferenze per vedere i tuoi miglioramenti. I carichi arrivano automaticamente dalle schede di allenamento.</p>
              </div>
              <button @click="openMeasurementModal()" class="w-full bg-salvia text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-salvia/90 transition-all active:scale-95 flex items-center justify-center gap-2">

              </button>
            </div>

            <template v-else>

              <div v-if="weightEntries.length > 0" @click="openHistory('weight')" role="button"

                <div class="flex justify-between items-end">
                  <div>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">PESO ATTUALE</span>
                    <div class="text-3xl font-extrabold text-antracite mt-1">
                      {{ formatNumber(latestWeight.weight) }} <span class="text-sm font-semibold text-gray-400">kg</span>
                    </div>
                    <p class="text-[10px] font-medium text-gray-400 mt-1">Ultima misurazione: {{ formatDate(latestWeight.date) }}</p>
                  </div>
                  <div class="flex flex-col items-end gap-2">
                    <span v-if="weightDelta" class="px-2 py-1 text-xs font-bold rounded-lg" :class="weightDelta.classes">{{ weightDelta.text }}</span>
                    <span class="text-[10px] font-bold text-salvia flex items-center gap-0.5">
                      Storico
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    </span>
                  </div>
                </div>

                <!-- SVG Line Chart (Light Theme) -->
                <div class="relative h-40 w-full pt-4">
                  <svg class="w-full h-full overflow-visible" viewBox="0 0 300 150">
                    <line x1="0" y1="30" x2="300" y2="30" stroke="#E5E7EB" stroke-dasharray="3,3"/>
                    <line x1="0" y1="75" x2="300" y2="75" stroke="#E5E7EB" stroke-dasharray="3,3"/>
                    <line x1="0" y1="120" x2="300" y2="120" stroke="#E5E7EB" stroke-dasharray="3,3"/>

                    <defs>
                      <linearGradient id="lightAreaGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
                      </linearGradient>
                    </defs>

                    <polygon :points="weightChart.area" fill="url(#lightAreaGrad)" />
                    <polyline :points="weightChart.line" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

                    <!-- Data Points -->
                    <g v-for="(pt, index) in weightChart.points" :key="index">
                      <circle :cx="pt.x" :cy="pt.y" r="5" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
                      <text v-if="pt.showLabel" :x="pt.x" :y="pt.y - 12" text-anchor="middle" fill="#1D1D1D" font-size="10" font-weight="bold">{{ pt.label }}</text>
                    </g>
                  </svg>
                </div>

                <p class="text-[11px] text-gray-400 font-medium text-center">
                  Dal {{ formatDate(weightEntries[0].date) }} al {{ formatDate(weightEntries[weightEntries.length - 1].date) }}
                  <span v-if="weightDelta && weightDelta.days > 0"> • {{ weightDelta.days }} giorni</span>
                </p>
              </div>

              <!-- CIRCONFERENZE -->
              <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                  <h4 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Circonferenze</h4>
                  <span v-if="circumferenceRows.length === 0" class="text-[10px] font-medium text-gray-400">Nessuna misura</span>
                </div>

                <div v-if="circumferenceRows.length === 0" class="bg-white border border-dashed border-gray-200 rounded-2xl p-4 text-center text-xs text-gray-400 font-medium">
                  Aggiungi petto, braccia e vita dalla scheda di misurazione.
                </div>

                <div class="space-y-2">
                  <div v-for="row in circumferenceRows" :key="row.key" @click="openHistory(row.key)" role="button"
                       class="flex items-center justify-between gap-2 p-4 bg-white border border-gray-100 shadow-sm rounded-2xl cursor-pointer hover:border-salvia/40 transition-colors active:scale-[0.99]">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-lg flex-shrink-0">{{ row.icon }}</div>
                      <div class="min-w-0">
                        <span class="text-sm font-bold text-antracite block truncate">{{ row.label }}</span>
                        <span class="text-[10px] font-medium text-gray-400">{{ row.count }} misur{{ row.count === 1 ? 'azione' : 'azioni' }}</span>
                      </div>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">
                      <div class="text-right">
                        <div class="flex items-baseline justify-end gap-1.5">
                          <span class="text-xs font-bold text-gray-400">{{ formatNumber(row.initial) }} cm</span>
                          <svg class="w-3 h-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                          <span class="text-sm font-extrabold" :class="row.currentColor">{{ formatNumber(row.current) }} cm</span>
                        </div>
                        <div v-if="row.count > 1" class="text-[10px] font-bold mt-0.5" :class="row.deltaColor">
                          {{ row.deltaText }}<span v-if="row.days > 0"> in {{ row.days }} gg</span>
                        </div>
                        <div v-else class="text-[10px] font-medium text-gray-400 mt-0.5">Prima misurazione</div>
                      </div>
                      <svg class="w-4 h-4 text-gray-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    </div>
                  </div>
                </div>
              </div>

              <!-- PROGRESSI ALLENAMENTO -->
              <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                  <h4 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Progressi Allenamento</h4>
                  <span v-if="workoutGroups.length === 0" class="text-[10px] font-medium text-gray-400">Nessun carico</span>
                </div>

                <div v-if="workoutGroups.length === 0" class="bg-white border border-dashed border-gray-200 rounded-2xl p-4 text-center text-xs text-gray-400 font-medium">

                </div>

                <div v-for="group in workoutGroups" :key="group.name" class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
                  <div class="flex justify-between items-start gap-3">
                    <div>
                      <h5 class="text-sm font-extrabold text-antracite">{{ group.name }}</h5>
                      <p class="text-[10px] text-gray-400 font-medium mt-0.5">{{ group.sessions }} session{{ group.sessions === 1 ? 'e' : 'i' }} • ultima {{ formatDate(group.lastDate) }}</p>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-1 rounded-lg whitespace-nowrap" :class="group.classes">{{ group.deltaText }}</span>
                  </div>
                  <div class="mt-3 flex items-end justify-between">
                    <div class="flex items-baseline gap-1">
                      <span class="text-xl font-extrabold text-arancione">{{ formatNumber(group.lastLoad) }}</span>
                      <span class="text-xs font-semibold text-gray-400">kg</span>
                      <span v-if="group.lastReps" class="text-[10px] text-gray-400 font-medium">× {{ formatNumber(group.lastReps) }}</span>
                    </div>
                    <span class="text-[10px] font-bold text-gray-400">da {{ formatNumber(group.firstLoad) }} kg</span>
                  </div>
                  <div class="mt-2 w-full bg-gray-100 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-arancione h-full rounded-full transition-all" :style="{ width: group.progressPct + '%' }"></div>
                  </div>
                </div>
              </div>

            </template>
          </div>

          <!-- ==================== NUTRIZIONE ==================== -->
          <div v-if="activeTab === 'nutrition'" class="space-y-6 animate-fadeIn">
            
            <!-- VISTA: LISTA DEI PIANI -->
            <div v-if="nutritionView === 'list'" class="space-y-5 animate-fadeIn">
              <div class="flex justify-between items-center">
                <div>
                  <div class="text-[10px] font-bold text-salvia tracking-widest uppercase">ALIMENTAZIONE</div>
                  <h2 class="text-2xl font-bold text-antracite">I tuoi Piani</h2>
                </div>
              </div>

              <!-- Lista Piani -->
              <div class="space-y-3">
                <div v-for="plan in sortedPlans" :key="plan.id" 
                     @click="openPlan(plan)"
                     class="bg-white rounded-3xl p-5 border border-gray-100 shadow-soft cursor-pointer hover:border-salvia/50 transition-all flex items-center justify-between group">
                  <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-bold shadow-sm"
                         :class="plan.status === 'active' ? 'bg-salvia/10 text-salvia border border-salvia/20' : 'bg-gray-100 text-gray-400'">
                      🍽️
                    </div>
                    <div>
                      <div class="flex items-center gap-2">
                        <h4 class="font-extrabold text-antracite text-base group-hover:text-salvia transition-colors">{{ plan.name }}</h4>
                        <span v-if="plan.status === 'active'" class="text-[9px] font-bold uppercase tracking-wider bg-salvia/10 text-salvia px-2 py-0.5 rounded-md">Attivo</span>
                      </div>
                      <p class="text-xs text-gray-500 font-medium mt-0.5">Dal {{ formatDate(plan.startDate) }} al {{ formatDate(plan.endDate) }}</p>
                    </div>
                  </div>
                  <div class="text-gray-400 group-hover:text-salvia transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                  </div>
                </div>
              </div>

              <!-- Aggiungi nuovo piano -->
              <button @click="startNewPlan" class="w-full py-4 border-2 border-dashed border-viola/40 bg-viola/5 rounded-3xl text-viola font-bold text-sm hover:border-viola hover:bg-viola/10 transition-colors flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Crea Nuovo Piano
              </button>
            </div>

            <!-- VISTA: CREA NUOVO PIANO -->
            <div v-if="nutritionView === 'create'" class="space-y-5 animate-fadeIn">
              <!-- Header -->
              <div class="flex items-center gap-3 mb-2">
                <button @click="nutritionView = 'list'" class="p-2.5 bg-white border border-gray-100 shadow-sm rounded-xl text-gray-400 hover:text-viola hover:border-viola/30 transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <div>
                  <div class="text-[10px] font-bold text-viola tracking-widest uppercase">{{ editingPlanId ? 'MODIFICA' : 'NUOVO INIZIO' }}</div>
                  <h2 class="text-2xl font-bold text-antracite leading-tight">{{ editingPlanId ? 'Modifica Piano' : 'Crea Piano' }}</h2>
                </div>
              </div>

              <!-- Form Creazione -->
              <div class="bg-white rounded-3xl p-5 border border-gray-100 shadow-soft space-y-5">
                
                <div>
                  <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5 pl-1">Nome del Piano</label>
                  <input type="text" v-model="newPlanData.name" placeholder="Es: Definizione Estiva, Massa..." 
                         class="w-full bg-gray-50 border border-gray-200 focus:border-viola focus:ring-2 focus:ring-viola/20 rounded-2xl p-3.5 text-sm font-semibold text-antracite outline-none transition-all placeholder:font-medium">
                </div>

                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5 pl-1">Data Inizio</label>
                    <input type="date" v-model="newPlanData.startDate" 
                           class="w-full bg-gray-50 border border-gray-200 focus:border-viola focus:ring-2 focus:ring-viola/20 rounded-2xl p-3 text-sm font-semibold text-antracite outline-none transition-all">
                  </div>
                  <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5 pl-1">Data Fine</label>
                    <input type="date" v-model="newPlanData.endDate" 
                           class="w-full bg-gray-50 border border-gray-200 focus:border-viola focus:ring-2 focus:ring-viola/20 rounded-2xl p-3 text-sm font-semibold text-antracite outline-none transition-all">
                  </div>
                </div>

                <label class="flex items-center gap-3 p-4 bg-viola/5 border border-viola/20 rounded-2xl cursor-pointer hover:bg-viola/10 transition-colors mt-2">
                  <input type="checkbox" v-model="newPlanData.makeActive" class="w-5 h-5 text-viola rounded focus:ring-viola border-viola/30 accent-viola">
                  <span class="text-sm font-bold text-viola">Imposta come piano attivo</span>
                </label>
                
              </div>

              <!-- Button Avanti (e Elimina se in modifica) -->
              <div class="flex flex-col gap-3 mt-4">
                <button @click="goToBuilder" class="w-full bg-viola text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-viola/90 transition-all active:scale-95 flex items-center justify-center gap-2">
                  Avanti
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </button>
                <button v-if="editingPlanId" @click="promptDeletePlan" class="w-full bg-white border border-red-200 text-red-500 font-bold py-3.5 rounded-2xl shadow-sm hover:bg-red-50 transition-all active:scale-95 flex items-center justify-center gap-2">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  Elimina Piano
                </button>
              </div>

            </div>

              <!-- Header -->

                <div class="flex items-center gap-3">
                  <button @click="nutritionView = 'create'" class="p-2.5 bg-white border border-gray-100 shadow-sm rounded-xl text-gray-400 hover:text-viola hover:border-viola/30 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                  </button>
                  <div>
                    <div class="text-[10px] font-bold text-viola tracking-widest uppercase">FASE 2</div>
                    <h2 class="text-2xl font-bold text-antracite leading-tight">{{ editingPlanId ? 'Modifica Menù' : 'Costruisci Menù' }}</h2>
                  </div>
                </div>
              </div>

              <!-- Settimane -->
              <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar pb-1">
                <button v-for="(week, wIdx) in newPlanBuilder.weeks" :key="wIdx" 
                        @click="newPlanBuilder.currentWeekIdx = wIdx"
                        class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-colors"
                        :class="newPlanBuilder.currentWeekIdx === wIdx ? 'bg-viola text-white shadow-md' : 'bg-white text-gray-500 border border-gray-100 hover:bg-gray-50'">
                  Settimana {{ wIdx + 1 }}
                </button>
                <button @click="addWeekToBuilder" class="px-3 py-2 rounded-xl text-xs font-bold bg-viola/10 text-viola whitespace-nowrap hover:bg-viola/20 transition-colors flex items-center gap-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                  Settimana
                </button>
              </div>

              <!-- Giorni -->
              <div class="bg-white rounded-3xl p-2 border border-gray-100 shadow-soft flex overflow-x-auto hide-scrollbar gap-1">
                <button v-for="day in weekDays" :key="day"
                        @click="newPlanBuilder.currentDay = day"
                        class="flex-1 min-w-[45px] py-3 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all"
                        :class="newPlanBuilder.currentDay === day ? 'bg-viola/10 text-viola font-extrabold' : 'text-gray-400 font-bold hover:bg-gray-50'">
                  <span class="text-xs">{{ day.substring(0,3) }}</span>
                </button>
              </div>

              <!-- Pasti del giorno selezionato -->
              <div class="space-y-4">
                <div class="flex justify-between items-center px-1">
                  <h3 class="text-sm font-bold text-antracite">Pasti di {{ newPlanBuilder.currentDay }}</h3>
                </div>

                <div v-if="currentBuilderMeals.length === 0" class="text-center py-6 bg-white rounded-3xl border border-dashed border-gray-200">
                  <p class="text-xs text-gray-400 font-medium">Nessun pasto inserito.<br>Inizia ad aggiungere i pasti per questa giornata.</p>
                </div>

                <div v-for="(meal, mIdx) in currentBuilderMeals" :key="mIdx" class="bg-white rounded-3xl p-4 border border-gray-100 shadow-sm space-y-3 relative">
                  <!-- Rimuovi Pasto -->
                  <button @click="removeMealFromBuilder(mIdx)" class="absolute top-4 right-4 text-red-400 hover:text-red-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  </button>

                  <!-- Tipo Pasto -->
                  <div class="pr-8">
                    <select v-model="meal.type" class="w-full bg-gray-50 border border-gray-200 focus:border-viola rounded-xl p-2.5 text-sm font-bold text-antracite outline-none appearance-none">
                      <option v-for="t in mealTypes" :key="t.id" :value="t.id">{{ t.icon }} {{ t.label }}</option>
                    </select>
                  </div>

                  <!-- Calorie del pasto -->
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest pl-1">Calorie</span>
                    <input type="text" inputmode="numeric" v-model="meal.calories" placeholder="Es: 450"
                           class="flex-1 bg-white border border-gray-200 focus:border-viola focus:ring-1 focus:ring-viola/20 rounded-xl p-2.5 text-xs font-bold text-antracite text-center outline-none transition-all placeholder:font-medium">
                    <span class="text-[10px] font-bold text-gray-400">kcal</span>
                  </div>

                  <!-- Slot Alimenti -->
                  <div class="space-y-2">
                    <div v-for="(item, iIdx) in meal.items" :key="iIdx" class="flex gap-2 items-center">
                      <input type="text" v-model="meal.items[iIdx]" placeholder="Es: 50g Riso Basmati" 
                             class="flex-1 bg-white border border-gray-200 focus:border-viola focus:ring-1 focus:ring-viola/20 rounded-xl p-2.5 text-xs font-medium text-antracite outline-none transition-all">
                      <button v-if="meal.items.length > 1" @click="removeSlotFromMeal(meal, iIdx)" class="p-2 text-gray-400 hover:text-red-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                      </button>
                    </div>
                  </div>
                  
                  <button @click="addSlotToMeal(meal)" class="text-[10px] font-bold text-viola uppercase tracking-widest flex items-center gap-1 hover:opacity-80">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Aggiungi Alimento
                  </button>
                </div>

                <!-- Aggiungi Pasto Button -->
              <button @click="addMealToBuilder" class="w-full py-3.5 border-2 border-dashed border-gray-200 bg-gray-50 rounded-2xl text-gray-500 font-bold text-xs hover:border-viola/40 hover:text-viola hover:bg-viola/5 transition-colors flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Nuovo Pasto
              </button>
            </div>

              <div v-for="row in historyRows" :key="row.entry.id" class="flex items-center justify-between gap-2 p-3 bg-gray-50 border border-gray-100 rounded-2xl">

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                  </button>

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>

        <nav class="bg-white/95 backdrop-blur-lg border-t border-gray-200 px-2 py-2.5 flex justify-between items-center z-20 absolute bottom-0 left-0 right-0 pb-6 sm:pb-2.5">
          <!-- Dashboard (Viola) -->
          <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'text-viola' : 'text-gray-400 hover:text-gray-500'" class="flex flex-col items-center gap-1 transition-all p-2 relative flex-1 group">
            <div :class="activeTab === 'dashboard' ? 'bg-viola/10 text-viola' : 'group-hover:bg-gray-100'" class="p-1.5 rounded-xl transition-colors">
              <svg class="w-6 h-6" stroke="currentColor" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            </div>
